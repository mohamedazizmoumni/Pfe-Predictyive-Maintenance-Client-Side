<header class="nav" [class.nav--scrolled]="scrolled()">
  <div class="nav__inner glass-panel glow-border">
    <a routerLink="/" class="nav__brand" (click)="closeMobileMenu()">
      <svg class="nav__brand-mark" width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <path d="M13 1.5 L23.5 7.25 V18.75 L13 24.5 L2.5 18.75 V7.25 Z" stroke="url(#navBrandGrad)" stroke-width="1.4" stroke-linejoin="round"/>
        <circle class="nav__brand-core" cx="13" cy="13" r="3" fill="url(#navBrandGrad)"/>
        <defs>
          <linearGradient id="navBrandGrad" x1="2.5" y1="1.5" x2="23.5" y2="24.5" gradientUnits="userSpaceOnUse">
            <stop offset="0" style="stop-color:var(--blue)" />
            <stop offset="1" style="stop-color:var(--cyan)" />
          </linearGradient>
        </defs>
      </svg>
      <span>Sentin<span class="accent">el</span></span>
    </a>

    <nav class="nav__links">
      <a *ngFor="let link of links" routerLink="/" [fragment]="link.fragment">{{ link.label }}</a>
      <a routerLink="/contact" routerLinkActive="active">Contact</a>
    </nav>

    <div class="nav__actions">
      <a routerLink="/demo" class="btn btn--primary btn--sm">Demander une démo</a>

      <button
        type="button"
        class="nav__burger"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen"
        aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  <nav class="nav__mobile glass-panel" *ngIf="mobileMenuOpen">
    <a *ngFor="let link of links" routerLink="/" [fragment]="link.fragment" (click)="closeMobileMenu()">{{ link.label }}</a>
    <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact</a>
    <a [href]="loginUrl" (click)="closeMobileMenu()">Se connecter</a>
    <a routerLink="/demo" class="btn btn--primary btn--block" (click)="closeMobileMenu()">Demander une démo</a>
  </nav>
</header>
