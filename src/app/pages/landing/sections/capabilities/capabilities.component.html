<section id="solutions" class="capabilities">
  <div class="section-head" appScrollReveal>
    <span class="eyebrow">Solutions</span>
    <h2>Six capacités. Une couche décisionnelle.</h2>
    <p>Tout ce qu'il faut pour passer des données brutes des capteurs à l'ordre de travail, sur une seule plateforme.</p>
  </div>

  <div class="capabilities__grid">
    <article
      class="cap-card"
      appTilt
      tabindex="0"
      *ngFor="let c of capabilities; let i = index"
      [appScrollReveal]="i * 90">
      <div class="cap-card__glow" aria-hidden="true"></div>

      <div class="cap-card__icon" [ngSwitch]="c.icon">
        <svg *ngSwitchCase="'monitoring'" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 12h4l2-7 4 14 2-7h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg *ngSwitchCase="'prediction'" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3 22 20 2 20 Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 9v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="17" r="0.9" fill="currentColor"/></svg>
        <svg *ngSwitchCase="'analytics'" width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="4" y="14" width="3.4" height="6" rx="0.6" fill="currentColor"/><rect x="10.3" y="9" width="3.4" height="11" rx="0.6" fill="currentColor"/><rect x="16.6" y="4" width="3.4" height="16" rx="0.6" fill="currentColor"/></svg>
        <svg *ngSwitchCase="'maintenance'" width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 12l2.3 2.3L15.5 9.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg *ngSwitchCase="'iot'" width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="5" cy="12" r="2.1" stroke="currentColor" stroke-width="1.5"/><circle cx="19" cy="6" r="2.1" stroke="currentColor" stroke-width="1.5"/><circle cx="19" cy="18" r="2.1" stroke="currentColor" stroke-width="1.5"/><path d="M7 11l10-4M7 13l10 4" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg *ngSwitchCase="'decision'" width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3 21 8 12 13 3 8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 14l9 5 9-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <h3>{{ c.title }}</h3>
      <p class="cap-card__desc">{{ c.description }}</p>
      <p class="cap-card__detail">{{ c.detail }}</p>
      <span class="cap-card__metric mono">{{ c.metric }}</span>
    </article>
  </div>
</section>
