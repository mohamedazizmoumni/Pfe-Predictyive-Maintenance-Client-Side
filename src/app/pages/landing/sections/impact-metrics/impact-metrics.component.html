<section id="analytics" class="impact">
  <div class="section-head" appScrollReveal>
    <span class="eyebrow">Impact</span>
    <h2>Des résultats mesurables.</h2>
    <p>Résultats cumulés des déploiements de Sentinel en production.</p>
  </div>

  <div class="impact__grid">
    <div class="impact-tile" *ngFor="let s of stats; let i = index" [appScrollReveal]="i * 120">
      <strong class="impact-tile__value mono accent-gradient">
        <span [appCountUp]="visible() ? s.value : 0" [countUpFormat]="s.format" [countUpDuration]="1600">0</span>
      </strong>
      <span class="tag-label">{{ s.label }}</span>
    </div>
  </div>
</section>
