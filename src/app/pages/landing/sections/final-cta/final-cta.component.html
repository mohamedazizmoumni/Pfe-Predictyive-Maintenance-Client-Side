<section class="final-cta">
  <div class="final-cta__bg" aria-hidden="true">
    <span class="final-cta__grid"></span>
    <span class="final-cta__glow final-cta__glow--1"></span>
    <span class="final-cta__glow final-cta__glow--2"></span>
    <span
      class="final-cta__particle"
      *ngFor="let p of particles()"
      [style.left.%]="p.x"
      [style.top.%]="p.y"
      [style.animation-delay.s]="p.delay"
      [style.animation-duration.s]="p.duration"></span>
  </div>

  <div class="final-cta__inner" appScrollReveal>
    <span class="tag-label">Prêt quand vous l'êtes</span>
    <h2>Transformez votre stratégie<br />de maintenance avec l'IA.</h2>
    <p>Déployez Sentinel sur votre première ligne de production en quelques semaines.</p>
    <a routerLink="/demo" class="btn btn--primary btn--lg">Lancer une maintenance intelligente</a>
  </div>
</section>
