<div #host class="scene" [class.scene--twin]="mode === 'twin'">
  <div class="scene__poster" aria-hidden="true">
    <span class="scene__poster-ring scene__poster-ring--1"></span>
    <span class="scene__poster-ring scene__poster-ring--2"></span>
    <span class="scene__poster-core"></span>
  </div>

  <canvas #canvas class="scene__canvas" [class.scene__canvas--ready]="ready()" aria-hidden="true"></canvas>
</div>
